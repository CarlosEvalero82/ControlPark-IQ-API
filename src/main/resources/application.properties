# ==============================================================
# ControlPark-IQ · Servicio web de autenticación
# Configuración de la aplicación
# ==============================================================

spring.application.name=controlpark-iq-auth

# Puerto donde escucha el servicio
server.port=8080

# --- Conexión a MySQL ---
# La base de datos se crea sola si no existe (createDatabaseIfNotExist=true).
# Usuario y contraseña se toman de variables de entorno; si no existen se usa root sin clave.
# NO escriba aquí su contraseña real de MySQL si va a subir el archivo a GitHub.
spring.datasource.url=jdbc:mysql://localhost:3306/controlpark_auth?createDatabaseIfNotExist=true&serverTimezone=America/Bogota
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# --- JPA / Hibernate ---
# update: crea o actualiza la tabla "usuarios" a partir de la entidad Usuario
spring.jpa.hibernate.ddl-auto=update
# Muestra en consola las sentencias SQL que se ejecutan
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
