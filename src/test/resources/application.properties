# Configuración SOLO para las pruebas automáticas (mvn test).
# Usa una base de datos H2 en memoria, así las pruebas no necesitan MySQL encendido.
spring.datasource.url=jdbc:h2:mem:controlpark_iq_api_test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
